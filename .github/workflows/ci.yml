name: CI

on:
  push:
    branches: [main, rebuild-v2]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collector v2 tests
        run: node --experimental-strip-types --test tests/collector-v2.test.ts tests/batch-sync-v2.test.ts tests/canonical-bridge-v2.test.ts
      - run: npm run typecheck
