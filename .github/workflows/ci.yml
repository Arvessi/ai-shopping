name: CI

on:
  push:
    branches: [main, rebuild-v2]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collector v2 tests
        run: node --experimental-strip-types --test tests/collector-v2.test.ts
      - run: npm run typecheck
      - name: Live M79 parser smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/rebuild-v2'
        run: node --experimental-strip-types scripts/m79-live-smoke.ts
